services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: controle_financeiro
    ports:
      - "5432:5432"
    volumes:
      - controle_financeiro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/controle_financeiro?schema=public"
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: "http://localhost:5173"
      JWT_ACCESS_SECRET: "troque-este-valor-por-um-segredo-forte"
      JWT_REFRESH_SECRET: "troque-este-outro-valor-tambem"
      ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL_DAYS: 30
    ports:
      - "4000:4000"

volumes:
  controle_financeiro_pgdata:
